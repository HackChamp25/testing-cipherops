# Validating resolver for the lab zones, served by NSD at 172.30.0.53.
server:
    directory: "/usr/local/etc/unbound"
    username: ""
    chroot: ""
    port: 53
    interface: 0.0.0.0
    access-control: 0.0.0.0/0 allow
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # PQC signatures are large: let UDP responses grow so you can watch
    # truncation and TCP fallback happen (or not) in Wireshark.
    edns-buffer-size: 1232
    max-udp-size: 1232

    # The lab zones are private, so allow queries to private addresses.
    do-not-query-localhost: no
    private-domain: "lab"

    # Turn caching off temporarily with "cache-max-ttl: 0" if you want
    # every query to hit NSD. Leave it on to measure cache behaviour.
    verbosity: 1
    val-log-level: 2
    logfile: ""
    use-syslog: no

    # DS records written by the signer for ecdsa.lab, slh.lab and mtl.lab.
    trust-anchor-file: "/zones/trust-anchors.txt"

stub-zone:
    name: "ecdsa.lab"
    stub-addr: 172.30.0.53
stub-zone:
    name: "slh.lab"
    stub-addr: 172.30.0.53
stub-zone:
    name: "mtl.lab"
    stub-addr: 172.30.0.53

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no
